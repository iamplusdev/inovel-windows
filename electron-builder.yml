appId: com.iamplus.inovel
productName: iNovel
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - build/icon.ico
  - package.json
asar: true
compression: maximum
win:
  icon: build/icon.ico
  # 统一产物命名：portable → iNovel-{ver}-portable.exe，zip → iNovel-{ver}-portable.zip
  artifactName: iNovel-${version}-portable.${ext}
  target:
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
